name: fork

# Reusable: build and ship a customized fork of someone else's CLI.
#
# The calling fork keeps `main` as an exact, fast-forward-only mirror of upstream and
# its own files on a separate default branch (`fork`): this caller workflow, the
# ordered list of topic branches to carry (`.fork/branches`) and the recorded conflict
# resolutions (`.fork/rr-cache`). Every run:
#
#   plan     merge main + each listed branch (rerere replays recorded resolutions),
#            then run the fork's `check` command on that merged tree. A conflict or
#            a red check stops here: nothing is built, the fleet keeps its release.
#   build    re-create the identical merge on each target runner, build, run
#            `smoke` against the built binary, tar it.
#   release  publish a PRERELEASE (mise never installs prereleases as `latest`).
#   verify   install that exact release with mise on each target and run `smoke`.
#   promote  clear the prerelease flag and mark it latest: machines now get it.
#
# With `publish: false` (pull requests) it stops after build.

on:
  workflow_call:
    inputs:
      binary:
        description: Executable name. Assets are `<binary>-<target>.tar.gz` with the binary at the archive root.
        type: string
        required: true
      mirror:
        description: The fork's branch that mirrors upstream's default branch (fast-forwarded, never committed to).
        type: string
        default: main
      build:
        description: Shell command, run at the root of the merged tree, that builds the binary.
        type: string
        required: true
      artifact:
        description: Path of the built binary, relative to the root of the merged tree.
        type: string
        required: true
      check:
        description: >-
          Gate run on the merged tree before anything is built (typecheck, tests). Required so
          every fork decides; pass `true` only for a fork that has nothing to check.
        type: string
        required: true
      smoke:
        description: Command run against the built and then the installed binary; `$BIN` is its path.
        type: string
        default: '"$BIN" --version'
      tools:
        description: Space-separated mise tool specs installed before check and build (for example `bun@1.4.4`).
        type: string
        default: ""
      targets:
        description: JSON array of {"target":"<asset suffix>","os":"<runner label>"}.
        type: string
        default: >-
          [{"target":"darwin-arm64","os":"macos-latest"},
           {"target":"linux-x64","os":"ubuntu-22.04"}]
      build_env:
        description: Newline-separated KEY=VALUE lines exported for check and build.
        type: string
        default: ""
      cache_path:
        description: Extra build output to cache across runs (for example a prebuilt native addon).
        type: string
        default: ""
      cache_key_paths:
        description: Space-separated paths whose git tree hashes key `cache_path`.
        type: string
        default: ""
      publish:
        description: Release, verify and promote. Callers pass `github.event_name != 'pull_request'`.
        type: boolean
        default: true
      force:
        description: Build even when the latest release already ships this exact merge.
        type: boolean
        default: false
    outputs:
      tag:
        description: Release tag of this run (empty when skipped).
        value: ${{ jobs.plan.outputs.tag }}
      skip:
        description: "`true` when the latest release already ships this merge."
        value: ${{ jobs.plan.outputs.skip }}

permissions:
  contents: read

env:
  FORK_SCRIPT: .zysys/scripts/fork.py

jobs:
  plan:
    name: Merge and check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      skip: ${{ steps.plan.outputs.skip }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Check out fork config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: config
          persist-credentials: false
      - name: Check out fork scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .zysys
          persist-credentials: false
      - name: Clone the fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.mirror }}
          path: work
          fetch-depth: 0
          filter: blob:none
      - name: Merge main and the listed branches
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          MIRROR: ${{ inputs.mirror }}
        run: |
          set -euo pipefail
          branches=config/.fork/branches
          [ -f "$branches" ] || : > "$branches"
          python3 "$FORK_SCRIPT" assemble --repo work --fetch --base-branch "$MIRROR" --branches "$branches" \
            --rr-cache config/.fork/rr-cache --out plan.json
          base="$(jq -r .base plan.json)"
          head="$(jq -r .head plan.json)"
          tag="build-$(date -u +%Y%m%d%H%M%S)-${base:0:7}-${head:0:7}"
          skip=false
          shipped="$(gh release view --json body --jq .body 2>/dev/null | sed -n 's/^build_commit: \([0-9a-f]\{40\}\)$/\1/p' | head -1 || true)"
          if [ "$shipped" = "$head" ] && [ "$FORCE" != "true" ]; then
            skip=true
            echo "::notice title=Up to date::the latest release already ships $head"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "tag=$tag"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Merge"
            echo "base \`$base\` + $(jq '.branches | length' plan.json) branches -> \`$head\`"
            jq -r '.branches[] | "- `\(.name)` \(.sha[0:9]) \(.state)"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-plan
          path: plan.json
          if-no-files-found: error
      - name: Install tools
        if: steps.plan.outputs.skip != 'true' && inputs.tools != ''
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - name: Check the merged tree
        if: steps.plan.outputs.skip != 'true'
        working-directory: work
        env:
          INPUT_CHECK: ${{ inputs.check }}
          INPUT_TOOLS: ${{ inputs.tools }}
          INPUT_BUILD_ENV: ${{ inputs.build_env }}
          MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          while IFS= read -r line; do [ -n "$line" ] && export "${line?}"; done <<< "${INPUT_BUILD_ENV:-}"
          if [ -n "${INPUT_TOOLS:-}" ]; then
            # shellcheck disable=SC2086 # tool specs are space-separated by contract
            mise use -g --yes $INPUT_TOOLS
            export PATH="$HOME/.local/share/mise/shims:$PATH"
          fi
          bash -euo pipefail -c "$INPUT_CHECK"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out fork config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: config
          persist-credentials: false
      - name: Check out fork scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .zysys
          persist-credentials: false
      - name: Clone the fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.mirror }}
          path: work
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-plan
      - name: Re-create the planned merge
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          set -euo pipefail
          python3 "$FORK_SCRIPT" assemble --repo work --fetch --plan plan.json --rr-cache config/.fork/rr-cache --out rebuilt.json > /dev/null
          got="$(git -C work rev-parse HEAD)"
          if [ "$got" != "$HEAD_SHA" ]; then
            echo "::error title=Merge differs::this runner merged $got, the plan merged $HEAD_SHA"
            exit 1
          fi
      - name: Install tools
        if: inputs.tools != ''
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - name: Restore Rust build cache
        if: hashFiles('work/Cargo.lock') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: work
          key: ${{ matrix.target }}
      - name: Key the extra cache
        id: cache-key
        if: inputs.cache_path != ''
        working-directory: work
        env:
          INPUT_CACHE_KEY_PATHS: ${{ inputs.cache_key_paths }}
        run: |
          set -euo pipefail
          key=""
          for p in $INPUT_CACHE_KEY_PATHS; do key="$key $(git rev-parse "HEAD:$p" 2>/dev/null || echo "absent:$p")"; done
          echo "key=$(printf '%s' "$key" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the extra cache
        if: inputs.cache_path != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/${{ inputs.cache_path }}
          key: fork-extra-${{ matrix.target }}-${{ steps.cache-key.outputs.key }}
      - name: Build
        working-directory: work
        env:
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_TOOLS: ${{ inputs.tools }}
          INPUT_BUILD_ENV: ${{ inputs.build_env }}
          FORK_TAG: ${{ needs.plan.outputs.tag }}
          FORK_TARGET: ${{ matrix.target }}
          MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          while IFS= read -r line; do [ -n "$line" ] && export "${line?}"; done <<< "${INPUT_BUILD_ENV:-}"
          if [ -n "${INPUT_TOOLS:-}" ]; then
            # shellcheck disable=SC2086
            mise use -g --yes $INPUT_TOOLS
            export PATH="$HOME/.local/share/mise/shims:$PATH"
          fi
          bash -euo pipefail -c "$INPUT_BUILD"
      - name: Smoke-test the built binary
        working-directory: work
        env:
          BIN: ${{ github.workspace }}/work/${{ inputs.artifact }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          [ -x "$BIN" ] || { echo "::error title=No binary::$BIN was not built"; exit 1; }
          bash -euo pipefail -c "$INPUT_SMOKE"
      - name: Tar the binary
        env:
          ARTIFACT: work/${{ inputs.artifact }}
          BINARY: ${{ inputs.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp "$ARTIFACT" "$stage/$BINARY"
          tar -czf "$RUNNER_TEMP/$BINARY-$TARGET.tar.gz" -C "$stage" "$BINARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ inputs.binary }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [plan, build]
    if: inputs.publish && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Create the prerelease
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BASE: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          set -euo pipefail
          cd assets
          mv plan.json fork-plan.json
          sha256sum ./*.tar.gz > SHA256SUMS
          {
            echo "Fork build: upstream \`${BASE:0:9}\` plus the branches in \`.fork/branches\`."
            echo
            jq -r '.branches[] | "- `\(.name)` \(.sha[0:9])"' fork-plan.json
            echo
            echo "build_commit: $HEAD_SHA"
            echo "base_commit: $BASE"
          } > notes.md
          # The tag points at the upstream commit: the merge itself is reproduced from
          # fork-plan.json (`fork.py assemble --plan`), never pushed.
          gh release create "$TAG" --target "$BASE" --prerelease --title "$TAG" \
            --notes-file notes.md ./*.tar.gz SHA256SUMS fork-plan.json

  verify:
    name: Install with mise on ${{ matrix.target }}
    needs: [plan, release]
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - name: Install the prerelease and smoke-test it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL: github:${{ github.repository }}@${{ needs.plan.outputs.tag }}
          BINARY: ${{ inputs.binary }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mise install --yes "$TOOL"
          BIN="$(mise exec "$TOOL" -- sh -c 'command -v "$0"' "$BINARY")"
          export BIN
          echo "installed $BIN"
          bash -euo pipefail -c "$INPUT_SMOKE"

  promote:
    name: Promote to latest
    needs: [plan, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # GitHub never marks a prerelease latest and mise skips prereleases, so clearing the
      # flag in the same call is what releases the build to machines.
      - run: gh release edit "$TAG" --prerelease=false --latest
