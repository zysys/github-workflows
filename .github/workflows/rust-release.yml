name: rust-release

# Reusable: build a Rust binary on one native runner per target and publish a
# GitHub release that `mise use -g github:<owner>/<repo>` can install.
#
# Rust does not cross-compile the way Go does (`go-release.yml` builds all
# targets on one runner), so each target builds on its own OS: a macOS runner
# for darwin-arm64, an x64 Linux runner for linux-x64, an arm64 Linux runner
# for linux-arm64. Assets are named `<binary>-<target>.tar.gz` plus
# SHA256SUMS, and the release is marked --latest unless `prerelease`, so
# mise's `version = "latest"` resolves it.

on:
  workflow_call:
    inputs:
      binary:
        description: Cargo binary to build. Its package must expose it as `--bin <binary>`.
        type: string
        required: true
      tag:
        description: Release tag to publish.
        type: string
        required: true
      targets:
        description: >-
          JSON array of `{"target":"<asset suffix>","os":"<runner label>"}`.
          Defaults to darwin-arm64, linux-x64 and linux-arm64.
        type: string
        default: >-
          [{"target":"darwin-arm64","os":"macos-latest"},
           {"target":"linux-x64","os":"ubuntu-22.04"},
           {"target":"linux-arm64","os":"ubuntu-22.04-arm"}]
      ref:
        description: Ref the build checks out. Defaults to the caller's commit.
        type: string
        default: ""
      release_target:
        description: Commit the release points at. Defaults to the caller's commit.
        type: string
        default: ""
      notes:
        description: Release body. Callers put machine-readable lines here and read them back.
        type: string
        default: ""
      prerelease:
        description: Publish as a prerelease (mise ignores prereleases) instead of --latest.
        type: boolean
        default: false
      cargo_args:
        description: Extra arguments after `cargo build --release --bin <binary>`.
        type: string
        default: ""
      build_env:
        description: Newline-separated KEY=VALUE lines exported for every build.
        type: string
        default: ""
      timeout_minutes:
        description: Per-target build timeout.
        type: number
        default: 120

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          INPUT_BINARY: ${{ inputs.binary }}
          INPUT_CARGO_ARGS: ${{ inputs.cargo_args }}
          INPUT_BUILD_ENV: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          # Each KEY=VALUE line of build_env is exported for the build only
          # (MACOSX_DEPLOYMENT_TARGET on macOS, for example).
          while IFS= read -r line; do
            [ -n "$line" ] && export "${line?}"
          done <<< "${INPUT_BUILD_ENV:-}"
          read -r -a extra <<< "${INPUT_CARGO_ARGS:-}"
          rustup run stable cargo build --release --bin "$INPUT_BINARY" "${extra[@]}"

      - name: Check the binary runs
        env:
          INPUT_BINARY: ${{ inputs.binary }}
        run: '"./target/release/$INPUT_BINARY" --version'

      - name: Tar the binary
        env:
          INPUT_BINARY: ${{ inputs.binary }}
          TARGET: ${{ matrix.target }}
        run: tar -czf "${RUNNER_TEMP}/${INPUT_BINARY}-${TARGET}.tar.gz" -C target/release "$INPUT_BINARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ inputs.binary }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Checksum assets
        run: |
          set -euo pipefail
          cd assets
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # gh ships on the runner and --latest is what mise reads for
      # `version = "latest"`: no third-party release action to pin or trust.
      - name: Create release
        env:
          TAG: ${{ inputs.tag }}
          BINARY: ${{ inputs.binary }}
          REF: ${{ inputs.ref || github.sha }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          target="${RELEASE_TARGET:-$REF}"
          [ -n "$target" ] || target="$(git rev-parse HEAD 2>/dev/null || true)"
          if [ "$PRERELEASE" = "true" ]; then
            channel=(--prerelease)
          else
            channel=(--latest)
          fi
          body="${NOTES:-Build of $BINARY at $target.}"
          gh release create "$TAG" \
            --target "$target" \
            "${channel[@]}" \
            --title "$TAG" \
            --notes "$body" \
            assets/"$BINARY"-*.tar.gz assets/SHA256SUMS
          echo "published $TAG"
